<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список задач — API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Мои задачи</h1>

        <!-- Форма добавления -->
        <form id="task-form">
            <label for="task-title">Задачи дня</label>
            <div class="input-group">
                <input id="task-title" type="text" placeholder="Что нужно сделать?" autocomplete="off">
                <button type="submit">Добавить</button>
            </div>
        </form>

        <!-- Фильтры -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="active">Активные</button>
            <button class="filter-btn" data-filter="completed">Выполненные</button>
        </div>

        <!-- Статус загрузки / ошибки -->
        <div id="status" class="status hidden"></div>

        <!-- Список задач -->
        <ul id="task-list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
